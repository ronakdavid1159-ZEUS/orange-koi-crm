<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrangeKoi CRM</title><style>
:root{--ink:#14213d;--muted:#68738a;--orange:#ff7a18;--cream:#fff7ed;--line:#e8eaf0}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui;background:#f7f8fc;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:240px;background:#14213d;color:white;padding:24px 16px}.brand{font-size:22px;font-weight:800;margin-bottom:28px}.brand span{color:#ff9a4d}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#dce3f2;padding:13px 14px;border-radius:10px;margin:4px 0}.nav button.active,.nav button:hover{background:#ff7a18;color:white}.main{flex:1;padding:28px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:5px}.actions{display:flex;gap:10px;align-items:center}.btn{padding:11px 15px;border-radius:10px;background:#14213d;color:white;font-weight:700}.btn.orange{background:var(--orange)}.search{padding:11px 14px;border:1px solid var(--line);border-radius:10px;width:260px;background:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px #14213d08}.kpi{font-size:30px;font-weight:800;margin-top:12px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}.bar{height:10px;background:#edf0f5;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase}tr.click{cursor:pointer}tr.click:hover{background:#fff8f2}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff0e2;color:#b84e00;font-size:12px;font-weight:700}.detail{position:fixed;inset:0;background:#f7f8fc;overflow:auto;z-index:4;padding:30px}.detail .head{max-width:1100px;margin:auto;display:flex;justify-content:space-between}.detail .body{max-width:1100px;margin:18px auto;display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:9px;background:white}.modal{position:fixed;inset:0;background:#14213d88;display:grid;place-items:center;z-index:8}.modal>div{background:white;border-radius:16px;padding:24px;width:min(720px,92vw);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timeline{border-left:2px solid #ffd2ad;padding-left:16px}.event{margin:12px 0}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:900px){.side{width:72px}.brand{font-size:0}.brand span{font-size:20px}.nav button{font-size:0}.cards,.grid,.detail .body{grid-template-columns:1fr}.search{width:160px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Orange<span>Koi</span></div><div class="nav"><button data-view="dashboard" class="active">◉ Dashboard</button><button data-view="accounts">▣ Accounts</button><button data-view="pipeline">◈ Pipeline</button><button data-view="owners">♙ Owners / KAM</button></div></aside><main class="main"><div class="top"><div><h1 id="title">OrangeKoi CRM</h1><div class="sub" id="subtitle">Shared sales pipeline workspace</div></div><div class="actions"><input id="search" class="search" placeholder="Search accounts, parts, segments…"><button class="btn orange" id="add">+ Add deal</button></div></div><section id="view"></section></main></div><div id="overlay"></div><script>
const URL='https://nrutrjsmqtmokjwbdryv.supabase.co',KEY='sb_publishable_e7iX-EshM47fN5XjM9hKTw_ZLLIhf3m';let state={view:'dashboard',q:'',accounts:[],deals:[],owners:[]};
async function api(path,opt={}){let r=await fetch(URL+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?[]:r.json()}
async function load(){[state.accounts,state.deals,state.owners]=await Promise.all([api('accounts?select=*'),api('deals?select=*,accounts(name,industry,segment,region,country),owners(name)&order=updated_at.desc'),api('owners?select=*&order=name')]);render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function match(x){return JSON.stringify(x).toLowerCase().includes(state.q.toLowerCase())}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));let v=state.view;document.getElementById('search').style.display=v==='dashboard'?'none':'block';if(v==='dashboard')dashboard();if(v==='accounts')accounts();if(v==='pipeline')pipeline();if(v==='owners')owners()}
function dashboard(){let total=state.deals.length, won=state.deals.filter(d=>/production|order/i.test(d.status)).length, quoted=state.deals.filter(d=>/quote|feasibility/i.test(d.status)).length;let by={};state.deals.forEach(d=>by[d.status]=(by[d.status]||0)+1);document.getElementById('view').innerHTML=`<div class="cards"><div class="card"><div class="muted">Total deals / parts</div><div class="kpi">${total}</div><div class="sub">Live from Supabase</div></div><div class="card"><div class="muted">Accounts</div><div class="kpi">${state.accounts.length}</div><div class="sub">Searchable customer universe</div></div><div class="card"><div class="muted">Feasibility + Quote</div><div class="kpi">${quoted}</div><div class="sub">Needs commercial follow-up</div></div><div class="card"><div class="muted">Orders / Production</div><div class="kpi">${won}</div><div class="sub">Late-stage pipeline</div></div></div><div class="grid"><div class="panel"><h3>Pipeline by stage</h3>${Object.entries(by).map(([k,n])=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b>${n}</b></div><div class="bar"><i style="width:${Math.max(5,n/Math.max(1,total)*100)}%"></i></div></div>`).join('')||'<div class="empty">Add your first deal to see the pipeline.</div>'}</div><div class="panel"><h3>Recent activity</h3>${state.deals.slice(0,6).map(d=>`<div class="event"><b>${esc(d.part_name)}</b><div class="muted">${esc(d.accounts?.name||'Unassigned')} · ${esc(d.status)}</div></div>`).join('')||'<div class="empty">No recent records.</div>'}</div></div>`}
function accounts(){let a=state.accounts.filter(match);document.getElementById('view').innerHTML=`<div class="panel"><h3>Accounts <span class="muted">${a.length}</span></h3><table><thead><tr><th>Account</th><th>Industry</th><th>Segment</th><th>Region</th><th>Deals / parts</th></tr></thead><tbody>${a.map(x=>{let n=state.deals.filter(d=>d.account_id===x.id).length;return `<tr class="click" onclick="accountDetail('${x.id}')"><td><b>${esc(x.name)}</b><div class="muted">${esc(x.account_code||'')}</div></td><td>${esc(x.industry)}</td><td>${esc(x.segment)}</td><td>${esc(x.region||x.country)}</td><td><span class="pill">${n}</span></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No matching accounts.</td></tr>'}</tbody></table></div>`}
function pipeline(){let d=state.deals.filter(match);document.getElementById('view').innerHTML=`<div class="panel"><h3>Pipeline <span class="muted">${d.length}</span></h3><table><thead><tr><th>Part / deal</th><th>Account</th><th>Owner</th><th>Status</th><th>FY</th><th>Qty</th><th>Remarks</th></tr></thead><tbody>${d.map(x=>`<tr class="click" onclick="detail('${x.id}')"><td><b>${esc(x.part_name)}</b><div class="muted">${esc(x.segment)} · ${esc(x.lead_gen_channel)}</div></td><td>${esc(x.accounts?.name)}</td><td>${esc(x.owners?.name)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.financial_year)}</td><td>${esc(x.qty_parts)}</td><td><input value="${esc(x.remarks||'')}" placeholder="Add remarks…" onclick="event.stopPropagation()" onchange="saveRemark('${x.id}',this.value)"></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No matching pipeline records.</td></tr>'}</tbody></table></div>`}function ownerDetail(id){let o=state.owners.find(x=>x.id===id),ds=state.deals.filter(d=>d.owner_id===id);document.getElementById('overlay').innerHTML=`<div class="detail"><div class="head"><div><h1>${esc(o.name)}</h1><div class="sub">Parts assigned to this owner / KAM</div></div><button class="btn" onclick="closeOverlay()">Close</button></div><div class="body"><div class="panel"><h3>Assigned parts</h3>${ds.map(d=>`<div class="event"><a href="#" onclick="detail('${d.id}');return false"><b>${esc(d.part_name)}</b></a><div class="muted">${esc(d.status)} · ${esc(d.accounts?.name||'Unassigned')}</div></div>`).join('')||'<div class="empty">No parts assigned.</div>'}</div></div></div>`}async function saveRemark(id,v){await api('deals?id=eq.'+id,{method:'PATCH',body:JSON.stringify({remarks:v})})}function owners(){document.getElementById('view').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Owners / KAM</h3><button class="btn orange" onclick="addOwner()">+ Add owner</button></div><table><thead><tr><th>Name</th><th>Created</th></tr></thead><tbody>${state.owners.map(o=>`<tr class="click" onclick="ownerDetail('${o.id}')"><td><b>${esc(o.name)}</b></td><td>${new Date(o.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`}
function accountDetail(id){let a=state.accounts.find(x=>x.id===id),ds=state.deals.filter(d=>d.account_id===id);document.getElementById('overlay').innerHTML=`<div class="detail"><div class="head"><div><h1>${esc(a.name)}</h1><div class="sub">${esc(a.industry)} · ${esc(a.segment)} · ${esc(a.region||a.country)}</div></div><button class="btn" onclick="closeOverlay()">Close</button></div><div class="body"><div class="panel"><h3>Related deals and parts</h3>${ds.map(d=>`<div class="event"><a href="#" onclick="detail('${d.id}');return false"><b>${esc(d.part_name)}</b></a><div class="muted">${esc(d.status)} · ${esc(d.owners?.name)}</div></div>`).join('')||'<div class="empty">No related deals yet.</div>'}</div><div class="panel"><h3>Account details</h3><p><b>Code:</b> ${esc(a.account_code)}</p><p><b>Country:</b> ${esc(a.country)}</p><p><b>Remarks:</b> ${esc(a.remarks)}</p></div></div></div>`}
function detail(id){let d=state.deals.find(x=>x.id===id);document.getElementById('overlay').innerHTML=`<div class="detail"><div class="head"><div><h1>${esc(d.part_name)}</h1><div class="sub">Read-only record view · ${esc(d.status)}</div></div><div class="actions"><button class="btn orange" onclick="editDeal('${id}')">Edit</button><button class="btn" onclick="closeOverlay()">Close</button></div></div><div class="body"><div class="panel">${d.image_url?`<img src="${esc(d.image_url)}" style="width:100%;max-height:260px;object-fit:contain;border-radius:12px">`:''}<h3>Deal details</h3><p><b>Account:</b> ${esc(d.accounts?.name)}</p><p><b>Industry:</b> ${esc(d.accounts?.industry)}</p><p><b>Account segment:</b> ${esc(d.accounts?.segment)}</p><p><b>Region:</b> ${esc(d.accounts?.region||d.accounts?.country)}</p><p><b>Owner:</b> ${esc(d.owners?.name)}</p><p><b>Segment:</b> ${esc(d.segment)} / ${esc(d.subsegment)}</p><p><b>Financial year:</b> ${esc(d.financial_year)}</p><p><b>Lead Gen Channel:</b> ${esc(d.lead_gen_channel)}</p><p><b>Quantity:</b> ${esc(d.qty_parts)}</p><p><b>Remarks:</b> ${esc(d.remarks)}</p><p><b>Tool cost:</b> ${esc(d.tool_cost)} · <b>Delivery:</b> ${esc(d.delivery_terms)} · <b>Payment:</b> ${esc(d.payment_terms)}</p></div><div class="panel"><h3>Full stage timeline</h3><div class="timeline">${Object.entries(d.stage_dates||{}).map(([k,v])=>`<div class="event"><b>${esc(k)}</b><div class="muted">${new Date(v).toLocaleString()}</div></div>`).join('')||'<div class="empty">No stage events recorded.</div>'}</div></div></div></div>`}
function editDeal(id){let d=state.deals.find(x=>x.id===id);document.getElementById('overlay').innerHTML=`<div class="modal"><div><div style="display:flex;justify-content:space-between"><h2>Edit deal</h2><button class="btn" onclick="detail('${id}')">Cancel</button></div><form id="editForm"><div class="formgrid"><label class="field">Part name<input name="part_name" required value="${esc(d.part_name)}"></label><label class="field">Status<select name="status">${['01. Lead identified','02. Contact established','03. NDA signed','04. Drawing shared','05. Technical feasibility, DFM and Initial Quote','06. Final Quote submitted','07. Order received','11. Commercial production','12. Dropped'].map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Owner<select name="owner_id">${state.owners.map(o=>`<option value="${o.id}" ${o.id===d.owner_id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></label><label class="field">Financial year<input name="financial_year" value="${esc(d.financial_year)}"></label><label class="field">Lead Gen Channel<input name="lead_gen_channel" value="${esc(d.lead_gen_channel)}"></label><label class="field">Qty of parts<input type="number" name="qty_parts" value="${esc(d.qty_parts)}"></label></div><label class="field">Remarks<textarea name="remarks">${esc(d.remarks)}</textarea></label><div class="formgrid"><label class="field">Tool cost<input name="tool_cost" value="${esc(d.tool_cost)}"></label><label class="field">Part image URL<input name="image_url" value="${esc(d.image_url)}"></label><label class="field">Delivery terms<input name="delivery_terms" value="${esc(d.delivery_terms)}"></label><label class="field">Payment terms<input name="payment_terms" value="${esc(d.payment_terms)}"></label></div><p class="muted">For Feasibility or Quote, quote and customer communication email URLs are required before saving.</p><div class="formgrid"><label class="field">Quote upload URL<input name="quote_file_url" value="${esc(d.quote_file_url)}"></label><label class="field">Customer email upload URL<input name="customer_email_file_url" value="${esc(d.customer_email_file_url)}"></label></div><button class="btn orange">Save changes</button></form></div></div>`;document.getElementById('editForm').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(/feasibility|quote/i.test(x.status)&&(!x.quote_file_url||!x.customer_email_file_url)){alert('Quote and customer communication email are required for this status.');return}x.qty_parts=x.qty_parts?+x.qty_parts:null;x.tool_cost=x.tool_cost?+x.tool_cost:null;await api('deals?id=eq.'+id,{method:'PATCH',body:JSON.stringify(x)});closeOverlay();await load();detail(id)}}
function addDeal(){let o=state.owners,a=state.accounts;document.getElementById('overlay').innerHTML=`<div class="modal"><div><div style="display:flex;justify-content:space-between"><h2>Add deal / part</h2><button class="btn" onclick="closeOverlay()">Cancel</button></div><form id="addForm"><div class="formgrid"><label class="field">Part name<input name="part_name" required></label><label class="field">Account<select name="account_id"><option value="">Unassigned</option>${a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label class="field">Owner<select name="owner_id">${o.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label class="field">Status<select name="status"><option>01. Lead identified</option><option>05. Technical feasibility, DFM and Initial Quote</option><option>06. Final Quote submitted</option></select></label><label class="field">Segment<input name="segment"></label><label class="field">Subsegment<input name="subsegment"></label><label class="field">Financial year<input name="financial_year" placeholder="FY27"></label><label class="field">Lead Gen Channel<input name="lead_gen_channel"></label><label class="field">Qty of parts<input type="number" name="qty_parts"></label></div><label class="field">Remarks<textarea name="remarks"></textarea></label><div class="formgrid"><label class="field">Part image URL<input name="image_url"></label><label class="field">Tool cost<input name="tool_cost"></label><label class="field">Delivery terms<input name="delivery_terms"></label><label class="field">Payment terms<input name="payment_terms"></label><label class="field">Quote upload URL<input name="quote_file_url"></label><label class="field">Customer email upload URL<input name="customer_email_file_url"></label></div><button class="btn orange">Save deal</button></form></div></div>`;document.getElementById('addForm').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(/feasibility|quote/i.test(x.status)&&(!x.quote_file_url||!x.customer_email_file_url)){alert('Quote and customer communication email are required for this status.');return}x.qty_parts=x.qty_parts?+x.qty_parts:null;x.tool_cost=x.tool_cost?+x.tool_cost:null;await api('deals',{method:'POST',body:JSON.stringify(x)});closeOverlay();await load()}}
async function addOwner(){let n=prompt('Owner / KAM name');if(n)await api('owners',{method:'POST',body:JSON.stringify({name:n})}).then(load)}function closeOverlay(){document.getElementById('overlay').innerHTML=''}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.getElementById('search').oninput=e=>{state.q=e.target.value;render()};document.getElementById('add').onclick=addDeal;load().catch(e=>document.getElementById('view').innerHTML='<div class="panel"><h3>Connection error</h3><p>'+esc(e.message)+'</p></div>');
</script></body></html>
